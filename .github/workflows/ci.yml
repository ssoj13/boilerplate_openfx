name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Conan
      run: pip install conan

    - name: Build
      run: python bootstrap.py b

    - name: Check
      run: python bootstrap.py c

    - name: Package bundle
      run: python bootstrap.py p

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openfx-plugin-windows
        path: dist/*.ofx.bundle/
        retention-days: 7
