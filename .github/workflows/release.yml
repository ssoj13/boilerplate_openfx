name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            artifact_name: "*.ofx.dll"
          - os: ubuntu-latest
            platform: linux-x64
            artifact_name: "*.ofx.so"
          - os: macos-latest
            platform: macos-universal
            artifact_name: "*.ofx.bundle"

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install conan

    - name: Configure Conan
      run: |
        conan profile detect --force

    - name: Install dependencies
      run: |
        conan install . --output-folder=build --build=missing --settings=build_type=Release

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -DCMAKE_TOOLCHAIN_FILE=build/build/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (Unix)
      if: runner.os != 'Windows'
      run: |
        cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=build/build/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Package artifacts
      run: |
        mkdir -p release
        find build -name "*.ofx*" -exec cp -r {} release/ \; || true
        find build -name "*.bundle" -exec cp -r {} release/ \; || true

    - name: Upload Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: openfx-plugin-${{ matrix.platform }}
        path: release/

  create-release:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}