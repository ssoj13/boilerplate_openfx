name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build and Release Windows
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Conan
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install conan

    - name: Configure Conan
      shell: cmd
      run: |
        conan profile detect --force

    - name: Install dependencies
      shell: cmd
      run: |
        conan install . --output-folder=build --build=missing --settings=build_type=Release

    - name: Configure CMake
      shell: cmd
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -DCMAKE_TOOLCHAIN_FILE="build/generators/conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: cmd
      run: |
        cmake --build build --config Release

    - name: Package artifacts
      shell: cmd
      run: |
        echo "=== Looking for compiled plugin files ==="
        dir /s build | findstr "\.ofx"
        
        echo "=== Creating plugin bundle structure ==="
        mkdir release 2>nul || echo Directory exists
        mkdir "release\colorFill.ofx.bundle\Contents\Win64" 2>nul || echo Bundle dir exists
        
        echo "=== Copying plugin files ==="
        if exist "build\Release\*.ofx.dll" (
          copy "build\Release\*.ofx.dll" "release\colorFill.ofx.bundle\Contents\Win64\"
          copy "build\Release\*.ofx.dll" release\
        )
        if exist "build\Release\*.ofx.lib" copy "build\Release\*.ofx.lib" release\
        
        echo "=== Checking for runtime dependencies ==="
        if exist "build\Release\*.dll" (
          echo Found additional DLLs:
          dir "build\Release\*.dll"
          copy "build\Release\*.dll" "release\colorFill.ofx.bundle\Contents\Win64\" 2>nul || echo No extra DLLs
        )
        
        echo "=== Copying license and documentation ==="
        if exist "LICENSE*" copy "LICENSE*" release\
        if exist "README.md" copy "README.md" release\
        if exist "CHANGELOG*" copy "CHANGELOG*" release\
        
        echo "=== Copying bundle metadata ==="
        copy "Info.plist" "release\colorFill.ofx.bundle\Contents\" 2>nul || echo "Info.plist not found"
        
        echo "=== Creating README for users ==="
        echo ColorFill OpenFX Plugin - Installation Instructions > release\INSTALL.txt
        echo ================================================== >> release\INSTALL.txt
        echo. >> release\INSTALL.txt
        echo CONTENTS: >> release\INSTALL.txt
        echo - colorFill.ofx.dll        : Direct plugin file >> release\INSTALL.txt
        echo - colorFill.ofx.bundle/    : Complete OpenFX bundle >> release\INSTALL.txt
        echo - Info.plist              : Bundle metadata >> release\INSTALL.txt
        echo - README.md               : Project documentation >> release\INSTALL.txt
        echo - Any additional DLLs     : Runtime dependencies >> release\INSTALL.txt
        echo. >> release\INSTALL.txt
        echo INSTALLATION OPTIONS: >> release\INSTALL.txt
        echo. >> release\INSTALL.txt
        echo Option 1 - Bundle Installation (Recommended): >> release\INSTALL.txt
        echo   Copy the entire colorFill.ofx.bundle folder to: >> release\INSTALL.txt
        echo   - Nuke: C:\Program Files\Nuke##\plugins\ >> release\INSTALL.txt
        echo   - Resolve: C:\Program Files\Blackmagic Design\DaVinci Resolve\OFX\Plugins\ >> release\INSTALL.txt
        echo   - User: %%USERPROFILE%%\AppData\Roaming\OFX\Plugins\ >> release\INSTALL.txt
        echo. >> release\INSTALL.txt
        echo Option 2 - Direct DLL Installation: >> release\INSTALL.txt
        echo   Copy colorFill.ofx.dll (and any other DLLs) to plugins folder >> release\INSTALL.txt
        echo. >> release\INSTALL.txt
        echo After installation, restart your host application. >> release\INSTALL.txt
        echo Plugin should appear under Color or Custom effects. >> release\INSTALL.txt
        
        echo "=== Contents of release directory ==="
        dir /s release

    - name: Upload Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: openfx-plugin-windows
        path: release/

  create-release:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}