name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Check tag matches version.txt
      shell: bash
      run: |
        v="$(tr -d '[:space:]' < version.txt)"
        [ "v$v" = "${{ github.ref_name }}" ] || { echo "Tag ${{ github.ref_name }} != version.txt ($v)"; exit 1; }

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Conan
      run: pip install conan

    - name: Build
      run: python bootstrap.py b

    - name: Check
      run: python bootstrap.py c

    - name: Package bundle
      run: python bootstrap.py p

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.zip
        generate_release_notes: true
