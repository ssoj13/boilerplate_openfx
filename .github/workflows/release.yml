name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build and Release Windows
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Conan
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install conan

    - name: Configure Conan
      shell: cmd
      run: |
        conan profile detect --force

    - name: Install dependencies
      shell: cmd
      run: |
        conan install . --output-folder=build --build=missing --settings=build_type=Release

    - name: Configure CMake
      shell: cmd
      run: |
        cmake -S . -B build -G "Visual Studio 17 2022" -DCMAKE_TOOLCHAIN_FILE="build/generators/conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: cmd
      run: |
        cmake --build build --config Release

    - name: Package artifacts
      shell: cmd
      run: |
        mkdir release 2>nul || echo Directory exists
        if exist "build\Release\*.ofx.*" copy "build\Release\*.ofx.*" release\
        if exist "build\*.ofx.*" copy "build\*.ofx.*" release\
        dir release

    - name: Upload Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: openfx-plugin-windows
        path: release/

  create-release:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: artifacts
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}